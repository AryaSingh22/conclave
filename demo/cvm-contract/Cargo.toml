[package]
name = "conclave-demo-escrow"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
publish = false
description = "CVM-schema demo contract for the Conclave Phase-2 §6 exit demo (dev tooling; never part of conclaved)"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# EXACT-pinned to 2.2.8 — the same version as the node's wasmvm v2.2.8 (D-079),
# so the contract stdlib and the VM that runs it are the same release. A caret
# range would have floated to 2.3.x, which is a DIFFERENT VM line than the one
# pinned in go.mod; that is the kind of quiet drift METHODOLOGY Rule 5 exists to
# stop, even on dev tooling. This crate is DEV TOOLING: not a Go dependency,
# absent from go.mod, and nothing it builds enters the consensus binary.
cosmwasm-std = { version = "=2.2.8", features = ["std"] }
cosmwasm-schema = "=2.2.8"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = "abort"
incremental = false
overflow-checks = true
strip = "symbols"
