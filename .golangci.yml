# Conclave lint configuration (SPEC §11.6: gofmt + golangci-lint enforced,
# including determinism guards — no wall-clock time, no floats, no map
# iteration into state writes in consensus code).
run:
  timeout: 10m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - gofmt
    - goimports
    - gosimple
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
    - depguard
    - forbidigo

linters-settings:
  goimports:
    local-prefixes: github.com/AryaSingh22/conclave
  depguard:
    rules:
      determinism:
        # SPEC §11.6: consensus code must be deterministic.
        deny:
          - pkg: math/rand
            desc: "non-deterministic; consensus code must not use math/rand (SPEC §11.6)"
          - pkg: math/rand/v2
            desc: "non-deterministic; consensus code must not use math/rand (SPEC §11.6)"
  forbidigo:
    forbid:
      - p: ^time\.Now$
        msg: "wall-clock time is non-deterministic; use ctx.BlockTime()/BlockHeight() (SPEC §11.6)"

issues:
  exclude-files:
    - ".*\\.pb\\.go$"
    - ".*\\.pb\\.gw\\.go$"
  exclude-rules:
    # tests and the CLI are not consensus code
    - path: _test\.go
      linters: [forbidigo, depguard]
    - path: ^cmd/
      linters: [forbidigo]
    - path: ^scripts/
      linters: [forbidigo]
    # SDK module-simulation operations are test-support code, not consensus:
    # the simtypes.Operation signature requires math/rand, and the randomness is
    # the framework's SEEDED *rand.Rand (deterministic given the seed), exactly
    # as the cosmos-sdk x/*/simulation packages do (task 0.11).
    - path: /simulation/
      linters: [depguard, forbidigo]
    - path: ^simutil/
      linters: [depguard, forbidigo]
