syntax = "proto3";
package conclave.escrow.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";

option go_package = "github.com/AryaSingh22/conclave/x/escrow/types";

// Msg defines the x/escrow Msg service. Message handling logic lands in
// Phase 2 (SPEC §6.5); the types are defined now so CONCLUDE legs and
// clients can reference them.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // ReleaseEscrow releases an escrow to the payee (HASHLOCK: by presenting
  // the preimage; OPTIMISTIC: after the dispute window).
  rpc ReleaseEscrow(MsgReleaseEscrow) returns (MsgReleaseEscrowResponse);

  // RaiseDispute opens a dispute within the dispute window (OPTIMISTIC).
  rpc RaiseDispute(MsgRaiseDispute) returns (MsgRaiseDisputeResponse);

  // SubmitDeliveryProof submits a groth16 delivery proof (ZK_DELIVERY).
  rpc SubmitDeliveryProof(MsgSubmitDeliveryProof) returns (MsgSubmitDeliveryProofResponse);
}

// MsgReleaseEscrow releases escrowed funds per the escrow's condition.
message MsgReleaseEscrow {
  option (cosmos.msg.v1.signer) = "signer";
  option (amino.name) = "conclave/escrow/MsgReleaseEscrow";

  string signer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string escrow_id = 2;
  // preimage is required for HASHLOCK conditions; empty otherwise.
  bytes preimage = 3;
}

message MsgReleaseEscrowResponse {}

// MsgRaiseDispute opens a dispute on an OPTIMISTIC escrow.
message MsgRaiseDispute {
  option (cosmos.msg.v1.signer) = "signer";
  option (amino.name) = "conclave/escrow/MsgRaiseDispute";

  string signer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string escrow_id = 2;
  // evidence_hash commits to the dispute evidence (hash-mismatch challenge).
  bytes evidence_hash = 3;
}

message MsgRaiseDisputeResponse {}

// MsgSubmitDeliveryProof proves delivery for a ZK_DELIVERY escrow.
message MsgSubmitDeliveryProof {
  option (cosmos.msg.v1.signer) = "signer";
  option (amino.name) = "conclave/escrow/MsgSubmitDeliveryProof";

  string signer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string escrow_id = 2;
  // proof is the serialized groth16 proof.
  bytes proof = 3;
}

message MsgSubmitDeliveryProofResponse {}
