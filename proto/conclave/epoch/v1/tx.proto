syntax = "proto3";
package conclave.epoch.v1;

import "amino/amino.proto";
import "conclave/epoch/v1/epoch.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/AryaSingh22/conclave/x/epoch/types";

// Msg is the x/epoch Msg service — the on-chain DKG transport (PHASE1_DESIGN
// §2(b) "Candidate A", D-068). Committee validators submit their DKG round
// bundles as OPAQUE bytes; the chain is a deterministic relay keyed by
// (epoch id, dkg index) and never interprets a bundle (only validators do,
// off-chain, D-061). Finalize counts agreement on the confirmed key.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // SubmitDeal posts a Round-1 deal bundle for the current FORMING epoch
  // (deal window). The bundle is opaque to the chain.
  rpc SubmitDeal(MsgSubmitDeal) returns (MsgSubmitDealResponse);

  // SubmitResponse posts a Round-2 response bundle (response window).
  rpc SubmitResponse(MsgSubmitResponse) returns (MsgSubmitResponseResponse);

  // ConfirmEpochKey posts a node's locally computed epoch public key + commits
  // (confirm window). Finalize publishes the value that >= t members confirm.
  rpc ConfirmEpochKey(MsgConfirmEpochKey) returns (MsgConfirmEpochKeyResponse);

  // UpdateParams updates the module parameters (governance authority only).
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

// MsgSubmitDeal carries one validator's Round-1 deal bundle.
message MsgSubmitDeal {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name) = "conclave/epoch/MsgSubmitDeal";

  // sender is the submitting validator's account; it must map to committee
  // member dkg_index of the current FORMING epoch.
  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 epoch_id = 2;
  uint32 dkg_index = 3;
  // bundle is the serialized kyber DealBundle (opaque to the chain).
  bytes bundle = 4;
}

message MsgSubmitDealResponse {}

// MsgSubmitResponse carries one validator's Round-2 response bundle.
message MsgSubmitResponse {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name) = "conclave/epoch/MsgSubmitResponse";

  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 epoch_id = 2;
  uint32 dkg_index = 3;
  // bundle is the serialized kyber ResponseBundle (opaque to the chain).
  bytes bundle = 4;
}

message MsgSubmitResponseResponse {}

// MsgConfirmEpochKey carries one validator's locally finalized epoch public key
// and verification polynomial. Finalize publishes the (epoch_pub_key, commits)
// value that >= t committee members confirm byte-identically.
message MsgConfirmEpochKey {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name) = "conclave/epoch/MsgConfirmEpochKey";

  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 epoch_id = 2;
  uint32 dkg_index = 3;
  bytes epoch_pub_key = 4;
  repeated bytes commits = 5;
}

message MsgConfirmEpochKeyResponse {}

// MsgUpdateParams updates module params; authority is the gov module account.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "conclave/epoch/MsgUpdateParams";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Params params = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

message MsgUpdateParamsResponse {}
