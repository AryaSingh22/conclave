syntax = "proto3";
package conclave.session.v1;

import "amino/amino.proto";
import "conclave/session/v1/session.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";

option go_package = "github.com/AryaSingh22/conclave/x/session/types";

// Query defines the x/session query service (SPEC §6.4). Solvers read open
// sessions through this surface (SPEC §7).
service Query {
  // Session returns a session by id.
  rpc Session(QuerySessionRequest) returns (QuerySessionResponse) {
    option (google.api.http).get = "/conclave/session/v1/sessions/{id}";
  }

  // CurrentSession returns the active session of a chamber.
  rpc CurrentSession(QueryCurrentSessionRequest) returns (QueryCurrentSessionResponse) {
    option (google.api.http).get = "/conclave/session/v1/current/{chamber_id}";
  }

  // Solver returns a solver registry entry.
  rpc Solver(QuerySolverRequest) returns (QuerySolverResponse) {
    option (google.api.http).get = "/conclave/session/v1/solvers/{addr}";
  }

  // Solvers returns all registered solvers.
  rpc Solvers(QuerySolversRequest) returns (QuerySolversResponse) {
    option (google.api.http).get = "/conclave/session/v1/solvers";
  }

  // Solutions returns the stored solutions of a session.
  rpc Solutions(QuerySolutionsRequest) returns (QuerySolutionsResponse) {
    option (google.api.http).get = "/conclave/session/v1/sessions/{session_id}/solutions";
  }

  // Params returns the module parameters.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/conclave/session/v1/params";
  }

  // Twap returns the session TWAP for one asset pair (task 2.5): the
  // windowed clearing-price average, its fee-conversion inverse, and
  // whether enough observations back it. base/quote ride as query params
  // because denoms may contain '/' (ibc/<hash>, data/{schema}).
  rpc Twap(QueryTwapRequest) returns (QueryTwapResponse) {
    option (google.api.http).get = "/conclave/session/v1/twap";
  }
}

message QuerySessionRequest {
  uint64 id = 1;
}

message QuerySessionResponse {
  Session session = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

message QueryCurrentSessionRequest {
  uint32 chamber_id = 1;
}

message QueryCurrentSessionResponse {
  Session session = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

message QuerySolverRequest {
  string addr = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

message QuerySolverResponse {
  Solver solver = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

message QuerySolversRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

message QuerySolversResponse {
  repeated Solver solvers = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QuerySolutionsRequest {
  uint64 session_id = 1;
}

message QuerySolutionsResponse {
  repeated Solution solutions = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

message QueryParamsRequest {}

message QueryParamsResponse {
  Params params = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

message QueryTwapRequest {
  // base identifies the asset being priced.
  string base = 1;
  // quote is the asset the price is quoted in.
  string quote = 2;
}

message QueryTwapResponse {
  // twap is the windowed average price (quote per base); zero when no
  // in-window observations exist.
  string twap = 1 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // rate is the inverse (base per quote) — the §6.2 fee-conversion
  // orientation; zero when twap is zero.
  string rate = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // observation_count is the number of in-window observations.
  uint64 observation_count = 3;
  // warm reports observation_count >= params.twap_min_observations — the
  // condition under which consumers use the TWAP instead of their fallback.
  bool warm = 4;
}
