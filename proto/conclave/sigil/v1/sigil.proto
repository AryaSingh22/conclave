syntax = "proto3";
package conclave.sigil.v1;

import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/AryaSingh22/conclave/x/sigil/types";

// Sigil is an agent's on-chain identity: DID root, credentials anchor point,
// and reputation (SPEC §6.1).
message Sigil {
  // id is the unique sigil identifier.
  string id = 1;
  // controller_addr is the root key controlling this sigil.
  string controller_addr = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // did_doc_hash is the hash of the W3C-DID-compatible document root.
  bytes did_doc_hash = 3;
  // metadata_uri points to off-chain sigil metadata.
  string metadata_uri = 4;
  // recovery_set are addresses that can jointly rotate the controller.
  repeated string recovery_set = 5 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // recovery_threshold is the number of recovery_set signatures required.
  uint32 recovery_threshold = 6;
  // created_height is the block height the sigil was registered at.
  uint64 created_height = 7;
  // chamber_id scopes the sigil to a chamber; fixed 0 until Phase 3 (SPEC §1.2).
  uint32 chamber_id = 8;
}

// CredentialAnchor anchors a verifiable credential to a sigil (SPEC §6.1).
message CredentialAnchor {
  // id is the unique credential identifier within the sigil.
  string id = 1;
  // sigil_id is the subject sigil.
  string sigil_id = 2;
  // issuer_sigil is the sigil of the credential issuer.
  string issuer_sigil = 3;
  // schema_id identifies the credential schema.
  string schema_id = 4;
  // claim_hash commits to the credential claim contents.
  bytes claim_hash = 5;
  // expiry_height is the block height at which the credential expires.
  uint64 expiry_height = 6;
  // revoked marks issuer revocation.
  bool revoked = 7;
  // chamber_id scopes the credential; fixed 0 until Phase 3.
  uint32 chamber_id = 8;
}

// Reputation is the deterministic, oracle-free reputation score of a sigil
// (SPEC §6.1 reputation math).
message Reputation {
  // sigil_id is the scored sigil.
  string sigil_id = 1;
  // score is the current reputation score (decays lazily).
  string score = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // last_decay_height is the height decay was last applied at.
  uint64 last_decay_height = 3;
  // concluded_count is the number of concluded settlements.
  uint64 concluded_count = 4;
  // disputed_count is the number of lost escrow disputes.
  uint64 disputed_count = 5;
  // chamber_id scopes the reputation; fixed 0 until Phase 3.
  uint32 chamber_id = 6;
}

// Params are the governable x/sigil module parameters (SPEC §6.1).
message Params {
  // base_gain is the base reputation gain per receipt (default 1.0).
  string base_gain = 1 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // decay_factor is the per-period multiplicative decay (default 0.995).
  string decay_factor = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // decay_period_blocks is the decay period in blocks (default: daily blocks).
  uint64 decay_period_blocks = 3;
  // penalty_multiplier scales base_gain into the lost-dispute penalty
  // (default 10 — SPEC §6.1 "penalty = 10× base_gain").
  string penalty_multiplier = 4 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
