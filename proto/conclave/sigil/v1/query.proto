syntax = "proto3";
package conclave.sigil.v1;

import "amino/amino.proto";
import "conclave/sigil/v1/sigil.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";

option go_package = "github.com/AryaSingh22/conclave/x/sigil/types";

// Query defines the x/sigil query service (SPEC §6.1).
service Query {
  // Sigil returns a sigil by id.
  rpc Sigil(QuerySigilRequest) returns (QuerySigilResponse) {
    option (google.api.http).get = "/conclave/sigil/v1/sigils/{id}";
  }

  // SigilByAddress resolves an address (controller or delegate key) to its
  // sigil via the reverse index (SPEC §6.1 key 0x04).
  rpc SigilByAddress(QuerySigilByAddressRequest) returns (QuerySigilByAddressResponse) {
    option (google.api.http).get = "/conclave/sigil/v1/sigils/by-address/{address}";
  }

  // Credentials returns the credential anchors of a sigil.
  rpc Credentials(QueryCredentialsRequest) returns (QueryCredentialsResponse) {
    option (google.api.http).get = "/conclave/sigil/v1/sigils/{sigil_id}/credentials";
  }

  // Reputation returns the reputation record of a sigil.
  rpc Reputation(QueryReputationRequest) returns (QueryReputationResponse) {
    option (google.api.http).get = "/conclave/sigil/v1/sigils/{sigil_id}/reputation";
  }

  // Params returns the module parameters.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/conclave/sigil/v1/params";
  }
}

message QuerySigilRequest {
  string id = 1;
}

message QuerySigilResponse {
  Sigil sigil = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

message QuerySigilByAddressRequest {
  string address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

message QuerySigilByAddressResponse {
  Sigil sigil = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

message QueryCredentialsRequest {
  string sigil_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

message QueryCredentialsResponse {
  repeated CredentialAnchor credentials = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryReputationRequest {
  string sigil_id = 1;
}

message QueryReputationResponse {
  Reputation reputation = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

message QueryParamsRequest {}

message QueryParamsResponse {
  Params params = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}
