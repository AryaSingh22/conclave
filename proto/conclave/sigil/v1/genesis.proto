syntax = "proto3";
package conclave.sigil.v1;

import "amino/amino.proto";
import "conclave/sigil/v1/sigil.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/AryaSingh22/conclave/x/sigil/types";

// GenesisState defines the x/sigil genesis state.
message GenesisState {
  Params params = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
  repeated Sigil sigils = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
  repeated CredentialAnchor credentials = 3 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
  repeated Reputation reputations = 4 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}
