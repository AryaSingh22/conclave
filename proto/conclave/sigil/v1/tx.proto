syntax = "proto3";
package conclave.sigil.v1;

import "amino/amino.proto";
import "conclave/sigil/v1/sigil.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/AryaSingh22/conclave/x/sigil/types";

// Msg defines the x/sigil Msg service (SPEC §6.1).
service Msg {
  option (cosmos.msg.v1.service) = true;

  // RegisterSigil registers a new agent identity.
  rpc RegisterSigil(MsgRegisterSigil) returns (MsgRegisterSigilResponse);

  // RotateController rotates the sigil controller key. Requires either the
  // current controller's signature or recovery_threshold signatures from the
  // recovery set (SPEC §6.1).
  rpc RotateController(MsgRotateController) returns (MsgRotateControllerResponse);

  // AnchorCredential anchors a verifiable credential to a sigil.
  rpc AnchorCredential(MsgAnchorCredential) returns (MsgAnchorCredentialResponse);

  // RevokeCredential revokes a previously anchored credential (issuer only).
  rpc RevokeCredential(MsgRevokeCredential) returns (MsgRevokeCredentialResponse);

  // UpdateParams updates the module parameters (governance authority only).
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

// MsgRegisterSigil registers a new sigil controlled by the signer.
message MsgRegisterSigil {
  option (cosmos.msg.v1.signer) = "controller";
  option (amino.name) = "conclave/sigil/MsgRegisterSigil";

  string controller = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes did_doc_hash = 2;
  string metadata_uri = 3;
  repeated string recovery_set = 4 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint32 recovery_threshold = 5;
  uint32 chamber_id = 6;
}

message MsgRegisterSigilResponse {
  string sigil_id = 1;
}

// MsgRotateController replaces the controller of a sigil. signers must be
// either [current controller] or >= recovery_threshold recovery-set members.
message MsgRotateController {
  option (cosmos.msg.v1.signer) = "signers";
  option (amino.name) = "conclave/sigil/MsgRotateController";

  repeated string signers = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string sigil_id = 2;
  string new_controller = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

message MsgRotateControllerResponse {}

// MsgAnchorCredential anchors a credential issued by issuer_sigil to sigil_id.
// The signer must be the controller of issuer_sigil.
message MsgAnchorCredential {
  option (cosmos.msg.v1.signer) = "issuer";
  option (amino.name) = "conclave/sigil/MsgAnchorCredential";

  string issuer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string issuer_sigil = 2;
  string sigil_id = 3;
  string schema_id = 4;
  bytes claim_hash = 5;
  uint64 expiry_height = 6;
}

message MsgAnchorCredentialResponse {
  string credential_id = 1;
}

// MsgRevokeCredential revokes a credential. The signer must be the controller
// of the issuing sigil (SPEC §6.1 "issuer only").
message MsgRevokeCredential {
  option (cosmos.msg.v1.signer) = "issuer";
  option (amino.name) = "conclave/sigil/MsgRevokeCredential";

  string issuer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string sigil_id = 2;
  string credential_id = 3;
}

message MsgRevokeCredentialResponse {}

// MsgUpdateParams updates module params; authority is the gov module account.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "conclave/sigil/MsgUpdateParams";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Params params = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

message MsgUpdateParamsResponse {}
