syntax = "proto3";
package conclave.mandate.v1;

import "amino/amino.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/AryaSingh22/conclave/x/mandate/types";

// Mandate is a consensus-enforced spending and capability policy bound to an
// agent/session key, checked in the ante handler before execution
// (SPEC §6.2 state — authoritative field list).
message Mandate {
  // id is the unique mandate identifier.
  string id = 1;
  // sigil_id is the agent identity this mandate belongs to.
  string sigil_id = 2;
  // grantee_addr is the agent/session key the mandate constrains.
  string grantee_addr = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // allowed_msg_types are the permitted msg TypeURLs (nested msgs are
  // unwrapped recursively in the ante handler — SPEC §6.2 step 3).
  repeated string allowed_msg_types = 4;
  // spend_ceiling_per_tx is the maximum spend intent of a single tx.
  repeated cosmos.base.v1beta1.Coin spend_ceiling_per_tx = 5 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // spend_ceiling_window is the maximum cumulative spend per window.
  repeated cosmos.base.v1beta1.Coin spend_ceiling_window = 6 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // window_blocks is the rolling window length in blocks.
  uint64 window_blocks = 7;
  // window_spent is the amount optimistically charged in the current window
  // (SPEC §6.2 step 5).
  repeated cosmos.base.v1beta1.Coin window_spent = 8 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // window_start_height is the height the current window started at.
  uint64 window_start_height = 9;
  // counterparty_class is a CEL predicate over counterparty sigil state;
  // empty means unrestricted. Enforced at solution validation (SPEC §6.2
  // step 6, §6.4 rule 5), not in the ante handler.
  string counterparty_class = 10;
  // fee_sponsor pays converted fees if set (SPEC §6.2 fee abstraction).
  string fee_sponsor = 11 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // fee_denoms are the denoms the grantee may pay gas in.
  repeated string fee_denoms = 12;
  // expiry_height is the height at which the mandate expires.
  uint64 expiry_height = 13;
  // revoked marks immediate revocation (effective next block).
  bool revoked = 14;
  // chamber_id scopes the mandate; fixed 0 until Phase 3 (SPEC §1.2).
  uint32 chamber_id = 15;
}

// Params are the governable x/mandate module parameters (SPEC §6.2).
message Params {
  // fee_conversion_rate is the fixed Phase-0 uusdc:uclv conversion rate used
  // by the FeeAbstractionDecorator (uclv per uusdc). Phase 2 replaces this
  // with a TWAP from session clearing prices.
  string fee_conversion_rate = 1 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // fee_pool is the CLV float held by the module for fee conversion, funded
  // at genesis (SPEC §6.2 "param: fee_pool").
  cosmos.base.v1beta1.Coin fee_pool = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
  // max_msg_nesting_depth caps recursive nested-msg unwrapping in the ante
  // handler; deeper txs are rejected with ErrMsgTooNested (SPEC §6.2 fuzz
  // targets; default 8).
  uint32 max_msg_nesting_depth = 3;
}
